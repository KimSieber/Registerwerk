[package]
name = "registerwerk-core"
description = "Kern von Registerwerk: Konfiguration, Dateibaum und Register. Ohne Oberfläche, damit er sich für andere Hüllen wiederverwenden lässt."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
# PDFium wird zur Laufzeit als dynamische Bibliothek geladen (tools/pdfium_holen.sh).
# Die Funktionsversion ist an die Version der Bibliothek gebunden.
pdfium-render = { version = "0.9.5", default-features = false, features = ["pdfium_8125", "thread_safe"] }
# AVIF über libavif mit dem Encoder libaom, beim ersten Bau aus dem Quelltext
# übersetzt (braucht CMake, unter x86 auch NASM). Gemessen v0.0.3: bei gleicher
# Qualität und Größe knapp 3-mal so schnell wie ravif (rav1e).
libavif-sys = { version = "0.18", default-features = false, features = ["codec-aom"] }
# Tesseract, statisch aus dem Quelltext gebaut (tools/tesseract_holen.sh)
registerwerk-ocr = { path = "../registerwerk-ocr" }
# "nur online"-Dateien über die Dateikoordination von macOS anfordern (v0.0.8)
registerwerk-macos = { path = "../registerwerk-macos" }
# Textebene als inkrementelle Änderung an die PDF anhängen (v0.0.5). Die
# vorhandenen Bytes der Datei bleiben dabei unverändert.
lopdf = { version = "0.47", default-features = false }
flate2 = "1"
# "array": Listen als Parameter (rarray) für die Filter der Suche
rusqlite = { version = "0.32", features = ["bundled", "array"] }
# Text aus Word, Excel, PowerPoint und OpenDocument (v0.0.6): ZIP mit XML
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
# Altes Office (v0.0.7): doc und ppt sind OLE-Verbunddateien, gelesen mit
# eigenem Leser (altoffice.rs). xls liest calamine, reines Rust.
cfb = "0.16"
calamine = { version = "0.38", default-features = false }
# Pages und Keynote: Snappy-komprimierte Protobuf-Archive (IWA)
snap = "1"
# Vorschauen für einzelne Bilder im Archiv (v0.0.6)
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "bmp", "gif", "webp"] }
# HEIC und HEIF (v0.0.7): Decoder in reinem Rust, im Vergleich mit libheif an
# iPhone-Fotos praktisch identisch. Kein C-Bau, keine LGPL.
zune-heic = "0.5"
# Vorschau von Textdateien (v0.0.7): Zeichen der eingebetteten Schrift rastern
ab_glyph = "0.2"
# TIFF aus Faxgeräten (CCITT Gruppe 3), die `image` nicht liest (v0.0.7):
# `tiff` für die Angaben der Datei, `fax` für die Zeilen
tiff = "0.11"
fax = "0.3"
# TIFF mit Farbpalette (v0.0.8), die `tiff` nicht liest: LZW selbst entpacken.
# Dieselbe Bibliothek nutzt `tiff` intern.
weezl = "0.1"
# Wortliste der unscharfen Suche als Automat (v0.0.6)
fst = { version = "0.4", features = ["levenshtein"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.8"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"
