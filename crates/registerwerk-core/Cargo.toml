[package]
name = "registerwerk-core"
description = "Kern von Registerwerk: Konfiguration, Dateibaum und Register. Ohne Oberfläche, damit er sich für andere Hüllen wiederverwenden lässt."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
# PDFium wird zur Laufzeit als dynamische Bibliothek geladen (tools/pdfium_holen.sh).
# Die Funktionsversion ist an die Version der Bibliothek gebunden.
pdfium-render = { version = "0.9.5", default-features = false, features = ["pdfium_8125", "thread_safe"] }
# AVIF über libavif mit dem Encoder libaom, beim ersten Bau aus dem Quelltext
# übersetzt (braucht CMake, unter x86 auch NASM). Gemessen v0.0.3: bei gleicher
# Qualität und Größe knapp 3-mal so schnell wie ravif (rav1e).
libavif-sys = { version = "0.18", default-features = false, features = ["codec-aom"] }
# Tesseract, statisch aus dem Quelltext gebaut (tools/tesseract_holen.sh)
registerwerk-ocr = { path = "../registerwerk-ocr" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.8"
unicode-normalization = "0.1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
