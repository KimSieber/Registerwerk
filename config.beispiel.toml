# Registerwerk: Vorlage für die Konfiguration
#
# Diese Datei nach "config.local.toml" kopieren und die Pfade eintragen.
# "config.local.toml" ist per .gitignore von der Versionierung ausgeschlossen.

# Wurzel des Cloud-Ordners auf diesem Gerät (absoluter Pfad).
# Alle Pfade im Register sind relativ dazu.
cloud_ordner = "/pfad/zum/cloud-ordner"

# Zu indizierende Verzeichnisse, relativ zum Cloud-Ordner.
verzeichnisse = [
    "Hauptverzeichnis/Unterordner1",
    "Hauptverzeichnis/Unterordner2",
]

# Ordner für die Arbeitskopie des Registers (absoluter Pfad, optional).
# Ohne Angabe liegt sie im Datenordner der Anwendung im Benutzerprofil,
# also außerhalb des Cloud-Ordners.
# register_ordner = "/pfad/zum/register"
